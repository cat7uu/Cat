<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Gallery</title>
  <style>
    :root {
      --bg: #fdf8f3;
      --card: #ffffff;
      --text: #3b2f2a;
      --muted: #8a7b72;
      --accent: #e07a5f;
      --accent-dark: #c4613f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
    }
    header h1 { margin: 0; font-size: 2.4rem; }
    header p { margin: .5rem 0 0; color: var(--muted); }

    .controls {
      display: flex;
      justify-content: center;
      gap: .75rem;
      flex-wrap: wrap;
      padding: 1rem;
    }
    button {
      font: inherit;
      border: none;
      border-radius: 999px;
      padding: .65rem 1.4rem;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: .6; cursor: wait; }
    button.secondary { background: #fff; color: var(--accent); border: 2px solid var(--accent); }
    button.secondary:hover { background: #fff3ef; }

    .gallery {
      columns: 4 260px;
      column-gap: 1rem;
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      break-inside: avoid;
      margin-bottom: 1rem;
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      cursor: zoom-in;
      position: relative;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .35s, transform .35s, box-shadow .2s;
    }
    .card.loaded { opacity: 1; transform: none; }
    .card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.15); }
    .card img { display: block; width: 100%; height: auto; }
    .fav {
      position: absolute;
      top: .5rem;
      right: .5rem;
      background: rgba(255,255,255,.9);
      color: var(--accent);
      padding: .35rem .6rem;
      font-size: 1.1rem;
      line-height: 1;
    }
    .fav:hover { background: #fff; }

    .status { text-align: center; color: var(--muted); padding: 1rem; min-height: 3rem; }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(20,14,10,.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    .lightbox .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.15);
      font-size: 1.6rem;
      padding: .6rem 1rem;
    }
    .lightbox .prev { left: 1rem; }
    .lightbox .next { right: 1rem; }
    .lightbox .close { position: absolute; top: 1rem; right: 1rem; background: rgba(255,255,255,.15); }

    footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 2rem 1rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>🐱 Cat Gallery</h1>
    <p>Real cat photos, fresh from the internet</p>
  </header>

  <div class="controls">
    <button id="more">Load more cats</button>
    <button id="shuffle" class="secondary">Shuffle</button>
    <button id="showFavs" class="secondary">♥ Favorites (<span id="favCount">0</span>)</button>
  </div>

  <main id="gallery" class="gallery"></main>
  <div id="status" class="status"></div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
    <button class="nav prev" aria-label="Previous">‹</button>
    <img id="lightboxImg" alt="Cat photo, enlarged" />
    <button class="nav next" aria-label="Next">›</button>
    <button class="close" aria-label="Close">✕</button>
  </div>

  <footer>
    Photos from <a href="https://thecatapi.com" target="_blank" rel="noopener">The Cat API</a>
    and <a href="https://cataas.com" target="_blank" rel="noopener">Cataas</a>.
  </footer>

  <script src="app.js"></script>
</body>
</html>
